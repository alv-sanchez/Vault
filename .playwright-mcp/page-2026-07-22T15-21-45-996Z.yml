    - heading "1. The one-paragraph version" [level=2] [ref=e47]
    - paragraph [ref=e48]:
      - text: A
      - strong [ref=e49]: short pay
      - text: is an invoice the customer paid
      - emphasis [ref=e50]: less than
      - text: what was owed. The driver
      - emphasis [ref=e51]: captures
      - text: the shortfall in the field (that half shipped in BMS-3844). This epic builds the
      - strong [ref=e52]: back-office
      - text: "half: the shortfall becomes a live number on the invoice ("
      - code [ref=e53]: Short_Pay_Amount__c
      - text: ), moves through a
      - strong [ref=e54]: status lifecycle
      - text: (
      - code [ref=e55]: Short_Pay_Status__c
      - text: ), and lands in an
      - strong [ref=e56]: AR review queue
      - text: . From that queue AR can resolve it five ways — post a credit, mark it collected, write it off, roll it onto the next invoice, or
      - strong [ref=e57]: hand it to the sales rep for in-field collection
      - text: (which creates a due-dated Task on the rep's route). A nightly
      - strong [ref=e58]: escalation batch
      - text: auto-flags aging/large shortfalls per state, a
      - strong [ref=e59]: rollup batch
      - text: tracks repeat offenders, and every state change writes an immutable
      - strong [ref=e60]: audit event
      - text: . A separate
      - strong [ref=e61]: approval gate
      - text: can block a driver from finalizing a stop until the right management layer signs off.
